<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Tela de login com visual limpo, profissional e pronto para GitHub Pages." />
    <title>Login | Escola Bíblica Dominical</title>
    <link rel="stylesheet" href="./src/modules/auth/pages/login/login.css" />
  </head>
  <body>
    <main class="shell" aria-label="Tela de login">
      <section class="brand-panel" aria-hidden="true">
        <div class="brand-mark">
          <span class="brand-mark__halo"></span>
          <img
            class="brand-mark__logo"
            src="./src/modules/auth/pages/login/assets/logo-assembleia-de-deus.png"
            alt="Logo da Assembleia de Deus"
          />
        </div>
      </section>

      <div class="login-card-wrap">
        <div class="login-quote-divider" aria-label='"O maior entre vocês é aquele que serve."'>
          <span>"O maior entre vocês é aquele que serve."</span>
        </div>

        <section class="card" aria-labelledby="login-title">
        <div class="card__header">
          <p class="eyebrow">Escola Bíblica Dominical</p>
          <h2 id="login-title">Login</h2>
        </div>

        <form id="loginForm" class="form" novalidate>
          <label class="field">
            <span>Usuário</span>
            <input id="username" name="username" type="text" autocomplete="username" required placeholder="Digite seu usuário" />
          </label>

          <label class="field">
            <span>Senha</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha" />
          </label>

          <div class="form__row">
            <label class="checkbox">
              <input id="rememberUser" type="checkbox" />
              <span>Lembrar usuário</span>
            </label>

            <a id="forgotPasswordLink" class="forgot-link" href="#" target="_blank" rel="noopener noreferrer">
              Esqueci minha senha
            </a>
          </div>

          <button id="loginButton" class="button" type="submit">
            Entrar
          </button>

          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </form>

        <section id="postLogin" class="success" hidden aria-live="polite">
          <div class="success__badge">✓</div>
          <h3>Login realizado com sucesso</h3>
          <p>
            O token foi armazenado com segurança para esta sessão e a base de navegação futura já está pronta.
          </p>
          <button id="logoutButton" class="button button--secondary" type="button">Sair</button>
        </section>
        </section>
      </div>
    </main>

    <div id="loginLoading" class="login-loading" aria-hidden="true">
      <div class="login-loading__content" role="status" aria-live="polite" aria-atomic="true">
        <div class="login-loading__mark login-loading__mark--loading" aria-hidden="true">
          <span class="login-loading__spinner"></span>
        </div>
        <p id="loginLoadingText" class="login-loading__text">Aguarde...</p>
      </div>
    </div>

    <script src="./src/app/config/config.js"></script>
    <script src="./src/app/config/api.js"></script>
    <script src="./src/app/config/storage.js"></script>
    <script src="./src/shared/services/api-client.js"></script>
    <script src="./src/app/config/error.js"></script>
    <script src="./src/modules/auth/pages/login/login.js"></script>
</body>
</html>
